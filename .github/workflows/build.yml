name: build-kernel
on:
  workflow_dispatch:
    inputs:
      enable_options:
        description: 'Enable PID_NS, IPC_NS, USER_NS, SYSVIPC'
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core flex bison build-essential zip curl libssl-dev bc python3 rsync cpio lz4 libncurses-dev
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod +x ~/repo
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Sync AOSP kernel tree
        run: |
          mkdir -p ~/gki && cd ~/gki
          ~/repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.4 --depth=1
          ~/repo sync -c --no-tags --no-clone-bundle -j4
      - name: Pin tag
        shell: bash
        run: |
          set -euo pipefail
          cd ~/gki/common
          R=$(git remote | head -1)
          git fetch --depth=1 "$R" tag android12-5.4.254_r00
          git checkout -f tags/android12-5.4.254_r00
          tr -d '\n' < "$GITHUB_WORKSPACE/scmversion.txt" > .scmversion
      - name: Enable container options
        if: ${{ inputs.enable_options }}
        shell: bash
        run: |
          set -euo pipefail
          cd ~/gki/common
          sed -i 's/^CONFIG_UAPI_HEADER_TEST=y$/&\nCONFIG_SYSVIPC=y\nCONFIG_POSIX_MQUEUE=y/' arch/arm64/configs/gki_defconfig
          sed -i 's/^# CONFIG_PID_NS is not set$/CONFIG_USER_NS=y/' arch/arm64/configs/gki_defconfig
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd ~/gki
          BUILD_CONFIG=common/build.config.gki.aarch64 ./build/build.sh 2>&1 | tee ~/build.log
          test -f out/android12-5.4/dist/Image
      - name: Check
        shell: bash
        run: |
          strings ~/gki/out/android12-5.4/dist/Image | grep -m1 "^Linux version 5"
          grep -E "CONFIG_(PID_NS|SYSVIPC|IPC_NS|USER_NS)=" ~/gki/out/android12-5.4/common/.config || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-dist-options-${{ inputs.enable_options }}
          path: |
            /home/runner/gki/out/android12-5.4/dist/Image
            /home/runner/gki/out/android12-5.4/dist/Module.symvers
            /home/runner/build.log
